{% extends "admin/base.html" %}

{% block content %}
<h2>Pages</h2>

<a href="/admin/pages/create" class="btn btn-primary mb-3">
  + Tambah Halaman
</a>

<table class="table table-bordered">
<tr>
  <th>Judul</th>
  <th>Slug</th>
  <th>Status</th>
</tr>

{% for page in pages %}
<tr>
  <td>{{ page.title }}</td>
  <td>{{ page.slug }}</td>
  <td>{{ page.status }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
