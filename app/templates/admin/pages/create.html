{% extends "admin/base.html" %}

{% block content %}
<h2>Buat Halaman</h2>

<form method="post">
  <input class="form-control mb-2" name="title" placeholder="Judul">
  <input class="form-control mb-2" name="slug" placeholder="slug-url">
  
  <textarea class="form-control mb-2" name="content" rows="8"></textarea>

  <select name="status" class="form-select mb-2">
    <option value="draft">Draft</option>
    <option value="published">Published</option>
  </select>

  <button class="btn btn-success">Simpan</button>
</form>
{% endblock %}
