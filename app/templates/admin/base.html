<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Admin ABI{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='admin/css/admin.css') }}" rel="stylesheet">
</head>
<body>

<div class="d-flex" id="wrapper">

  <!-- Sidebar -->
  <div class="border-end bg-light" id="sidebar-wrapper">
    <div class="sidebar-heading fw-bold p-3">
      ABI SUMSEL
    </div>
    <div class="list-group list-group-flush">
      <a href="/admin/" class="list-group-item list-group-item-action">Dashboard</a>
      <a href="/admin/news" class="list-group-item list-group-item-action">Berita</a>
      <a href="/admin/pages" class="list-group-item list-group-item-action">Halaman</a>
      <a href="/admin/logout" class="list-group-item list-group-item-action text-danger">Logout</a>
    </div>
  </div>

  <!-- Page Content -->
  <div id="page-content-wrapper">
    <nav class="navbar navbar-light bg-white border-bottom px-3">
      <button class="btn btn-outline-secondary" id="menu-toggle">☰</button>
      {% if g.user %}
        <span class="ms-auto">{{ g.user.email }}</span>
      {% else %}
        <span class="ms-auto">Not logged in</span>
      {% endif %}
    </nav>

    <div class="container-fluid py-4">
      {% block content %}{% endblock %}
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById("menu-toggle").addEventListener("click", function () {
  document.getElementById("wrapper").classList.toggle("toggled");
});
</script>

</body>
</html>
