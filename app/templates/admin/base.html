<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Admin ABI{% endblock %}</title>

  <!-- WAJIB: viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='admin/css/admin.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<!-- ====== NAVBAR ====== -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container-fluid">

    <!-- Mobile toggle -->
    <button class="btn btn-outline-secondary d-lg-none"
            data-bs-toggle="offcanvas"
            data-bs-target="#adminSidebar"
            aria-label="Toggle menu">
      <i class="bi bi-list"></i>
    </button>

    <span class="navbar-brand fw-bold ms-2">Admin ABI</span>

    <div class="ms-auto">
      {% if g.user %}
        <span class="text-muted small">{{ g.user.email }}</span>
      {% else %}
        <span class="text-muted small">Not logged in</span>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">

    <!-- ====== SIDEBAR DESKTOP ====== -->
    <aside class="col-lg-2 d-none d-lg-block bg-white border-end min-vh-100 p-0">
      <div class="p-3 fw-bold border-bottom">ABI SUMSEL</div>
      <div class="list-group list-group-flush">
        <a href="/admin/" class="list-group-item list-group-item-action">
          <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
        <a href="/admin/news" class="list-group-item list-group-item-action">
          <i class="bi bi-newspaper me-2"></i> Berita
        </a>
        <a href="/admin/pages" class="list-group-item list-group-item-action">
          <i class="bi bi-file-text me-2"></i> Halaman
        </a>
        <a href="/admin/logout" class="list-group-item list-group-item-action text-danger">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </a>
      </div>
    </aside>

    <!-- ====== MAIN CONTENT ====== -->
    <main class="col-12 col-lg-10 px-4 py-4">
      {% block content %}{% endblock %}
    </main>

  </div>
</div>

<!-- ====== SIDEBAR MOBILE (OFFCANVAS) ====== -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="adminSidebar">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">ABI SUMSEL</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-0">
    <div class="list-group list-group-flush">
      <a href="/admin/" class="list-group-item list-group-item-action">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
      <a href="/admin/news" class="list-group-item list-group-item-action">
        <i class="bi bi-newspaper me-2"></i> Berita
      </a>
      <a href="/admin/pages" class="list-group-item list-group-item-action">
        <i class="bi bi-file-text me-2"></i> Halaman
      </a>
      <a href="/admin/logout" class="list-group-item list-group-item-action text-danger">
        <i class="bi bi-box-arrow-right me-2"></i> Logout
      </a>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
