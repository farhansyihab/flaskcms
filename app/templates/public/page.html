<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>{{ seo.title if seo else page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ seo.description if seo else '' }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="https://farhansyihab.github.io/abi-firebase/public/img/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="https://farhansyihab.github.io/abi-firebase/public/img/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://farhansyihab.github.io/abi-firebase/public/img/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://farhansyihab.github.io/abi-firebase/public/img/icons/apple-touch-icon-180x180.png">
  <link rel="manifest" href="https://farhansyihab.github.io/abi-firebase/public/site.webmanifest">

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://farhansyihab.github.io/abi-firebase/public/main.css">
</head>
<body>

<!-- HEADER -->
<div id="header-placeholder"></div>

<main class="container py-5">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/">Beranda</a></li>
      <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
    </ol>
  </nav>
  
  <article>
    <header class="mb-4">
      <h1 class="display-5">{{ page.title }}</h1>
    </header>
    
    <div class="page-content">
      {% if page.content_html %}
        {{ page.content_html|safe }}
      {% else %}
        <div class="alert alert-info">
          <i class="bi bi-info-circle"></i>
          Konten halaman ini masih kosong.
        </div>
      {% endif %}
    </div>
  </article>
</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Load header and footer
fetch("https://farhansyihab.github.io/abi-firebase/public/includes/header.html")
  .then(r => r.text())
  .then(t => document.getElementById("header-placeholder").innerHTML = t);

fetch("https://farhansyihab.github.io/abi-firebase/public/includes/footer.html")
  .then(r => r.text())
  .then(t => document.getElementById("footer-placeholder").innerHTML = t);
</script>

</body>
</html>
