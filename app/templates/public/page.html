{% extends "public/base.html" %}

{% block content %}
<!-- HEADER -->
<div id="header-placeholder"></div>

<main class="container py-5">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/">Beranda</a></li>
      <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
    </ol>
  </nav>
  
  <article>
    <div class="page-content">
      {% if page.content_html %}
        {{ page.content_html|safe }}
      {% else %}
        <div class="alert alert-info">
          <i class="bi bi-info-circle"></i>
          Konten halaman ini masih kosong.
        </div>
      {% endif %}
    </div>
  </article>
</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>

<script>
fetch("/includes/header.html").then(r=>r.text()).then(t=>document.getElementById("header-placeholder").innerHTML=t);
fetch("/includes/footer.html").then(r=>r.text()).then(t=>document.getElementById("footer-placeholder").innerHTML=t);
</script>
{% endblock %}
