<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>DPW ABI Sumatera Selatan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ seo.title if seo else "ABI Sumsel" }}</title>
  <meta name="description" content="{{ seo.description if seo else '' }}">

  {% if seo and seo.image %}
  <meta property="og:image" content="{{ seo.image }}">
  {% endif %}

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://farhansyihab.github.io/abi-firebase/public/img/icons/favicon.ico">

    <link rel="icon" type="image/png" sizes="32x32" href="https://farhansyihab.github.io/abi-firebase/public/img/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://farhansyihab.github.io/abi-firebase/public/img/icons/favicon-16x16.png">

    <link rel="apple-touch-icon" sizes="180x180" href="https://farhansyihab.github.io/abi-firebase/public/img/icons/apple-touch-icon-180x180.png">

    <link rel="manifest" href="https://farhansyihab.github.io/abi-firebase/public/site.webmanifest">


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://farhansyihab.github.io/abi-firebase/public/main.css">
</head>
<body>

<!-- HEADER -->
<div id="header-placeholder"></div>

<main class="container py-5">
  <h1 class="mb-4">Selamat Datang di ABI Sumatera Selatan</h1>
  <p>Website resmi DPW ABI Sumatera Selatan.</p>
</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
fetch("/includes/header.html").then(r=>r.text()).then(t=>document.getElementById("header-placeholder").innerHTML=t);
fetch("/includes/footer.html").then(r=>r.text()).then(t=>document.getElementById("footer-placeholder").innerHTML=t);
</script>

</body>
</html>
